[project]
name = "watermarkremover-ai"
version = "1.0.0"
description = "AI-powered watermark removal using Florence-2 detection and LaMA inpainting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # AI/ML core
    "torch>=2.4.0",
    "transformers>=4.50.0",
    "numpy",

    # Image/Video processing
    "opencv-python-headless>=4.12.0",
    "Pillow>=10.0.0",

    # Utilities
    "loguru",
    "click",
    "tqdm",
    "psutil",
    "pyyaml",

    # iopaint (LaMA inpainting) - deps overridden below
    "iopaint",

    # Hugging Face for model downloads
    "huggingface-hub",
]

[project.optional-dependencies]
cuda = ["torch>=2.4.0"]  # CUDA-enabled PyTorch from pytorch-cuda index

[project.scripts]
watermark-remover = "watermark_remover.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watermark_remover"]

# =============================================================================
# UV CONFIGURATION
# =============================================================================

[tool.uv]

# PyTorch source: use CUDA index when cuda extra is specified
[tool.uv.sources]
torch = { index = "pytorch-cuda", extra = "cuda" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# Override iopaint's dependencies - include what we need for LaMA
[[tool.uv.dependency-metadata]]
name = "iopaint"
requires-dist = [
    "pydantic",
    "typer",
    "einops",
    "omegaconf",
    "easydict",
    "yacs",
    "diffusers",
    "safetensors",
    "piexif",
    "imghdr-lts; python_version >= '3.13'",  # backport for Python 3.13+
]

# =============================================================================
# RUFF CONFIGURATION
# =============================================================================

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.14.13",
]
