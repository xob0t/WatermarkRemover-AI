[project]
name = "watermarkremover-ai"
version = "1.0.0"
description = "AI-powered watermark removal using Florence-2 detection and LaMA inpainting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # AI/ML core
    "torch>=2.4.0",
    "transformers>=4.50.0",
    "numpy",

    # Image/Video processing
    "opencv-python-headless>=4.12.0",
    "Pillow>=10.0.0",

    # Utilities
    "loguru",
    "click",
    "tqdm",
    "psutil",
    "pyyaml",

    # iopaint (LaMA inpainting) - deps overridden below
    "iopaint",

    # Hugging Face for model downloads
    "huggingface-hub",
]

[project.scripts]
watermark-remover = "watermark_remover.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watermark_remover"]

# =============================================================================
# UV CONFIGURATION
# =============================================================================

[tool.uv]

# Override iopaint's dependencies - only include what we actually need
[[tool.uv.dependency-metadata]]
name = "iopaint"
requires-dist = [
    "pydantic",
    "typer",
    "einops",
    "omegaconf",
    "easydict",
    "yacs",
]

# =============================================================================
# RUFF CONFIGURATION
# =============================================================================

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
