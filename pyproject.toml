[project]
name = "watermarkremover-ai"
version = "1.0.0"
description = "AI-powered watermark removal using Florence-2 detection and LaMA inpainting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # AI/ML core
    "torch>=2.4.0",
    "transformers>=4.50.0",
    "numpy",

    # Image/Video processing
    "opencv-python-headless>=4.12.0",
    "Pillow>=10.0.0",

    # GUI
    "pywebview>=4.0",

    # Utilities
    "loguru",
    "click",
    "tqdm",
    "psutil",
    "pyyaml",

    # iopaint dependencies (manually specified to avoid iopaint's heavy deps)
    "pydantic",
    "typer",
    "einops",
    "omegaconf",
    "easydict",
    "yacs",

    # Hugging Face for model downloads
    "huggingface-hub",
]

[project.scripts]
watermark-remover = "watermark_remover.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watermark_remover"]

# =============================================================================
# UV CONFIGURATION
# =============================================================================

[tool.uv]

# PyTorch CUDA 12.4 index for Windows/Linux with NVIDIA GPU
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# Source mappings: Use CUDA on Windows/Linux, default PyPI on macOS
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

# =============================================================================
# RUFF CONFIGURATION
# =============================================================================

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
